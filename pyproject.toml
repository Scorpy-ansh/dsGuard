
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsguard"
version = "0.1.0"
description = "Non-target-aware dsRNA design with continuous-match risk profiling across an organism panel"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dsguard = "dsguard.cli:main"

[tool.setuptools]
packages = ["dsguard"]

[tool.pytest.ini_options]
testpaths = ["Random", "backend"]
